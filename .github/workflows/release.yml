name: Release Obsidian plugin

# バージョンタグ（例: 0.2.0）を push すると:
#   1. プラグインをビルド
#   2. タグと manifest.json のバージョン一致を検証
#   3. main.js / manifest.json / styles.css を添付したリリースを作成
# BRAT 1.1+ は GitHub Release の資産を正として取得する。タグのコミットそのものを
# ビルドするため、main 以外の検証ブランチから切ったプレリリースにも対応する。

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        working-directory: plugin
        env:
          OBSIDIAN_PLUGIN_DIR: dist
        run: |
          npm ci
          npm run build

      - name: Verify release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugin/dist/manifest.json').version")
          test "$VERSION" = "$GITHUB_REF_NAME" || {
            echo "tag ($GITHUB_REF_NAME) and manifest version ($VERSION) differ"
            exit 1
          }

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=(--notes "自動ビルド ($TAG)。BRAT でインストール／更新できます。")
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi
          gh release create "$TAG" \
            plugin/dist/main.js \
            plugin/dist/manifest.json \
            plugin/dist/styles.css \
            --title "VoxCraft $TAG" \
            "${FLAGS[@]}"
