name: Release Obsidian plugin

# バージョンタグ（例: 0.2.0）を push すると:
#   1. プラグインをビルド
#   2. main.js / manifest.json / styles.css をリポジトリのルートへ同期してコミット
#      （BRAT はルートの manifest.json でプラグインを認識・バージョン判定する）
#   3. 同じ3ファイルを添付したリリースを作成（BRAT はリリース資産をDLする）
# ルートとリリースの両方を最新に保つことで、BRAT のどの参照経路でも更新が届く。

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        working-directory: plugin
        env:
          OBSIDIAN_PLUGIN_DIR: dist
        run: |
          npm install
          npm run build

      - name: Sync root files for BRAT
        run: |
          cp plugin/dist/main.js plugin/dist/manifest.json plugin/dist/styles.css .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.js manifest.json styles.css
          git commit -m "chore: sync root plugin files for ${GITHUB_REF_NAME}" || echo "no changes to commit"
          git push origin HEAD:main

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            plugin/dist/main.js \
            plugin/dist/manifest.json \
            plugin/dist/styles.css \
            --title "VoxCraft $TAG" \
            --notes "自動ビルド ($TAG)。BRAT でインストール／更新できます。" \
            --latest
